<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            position: relative;
        }

        /* Loading Screen */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            gap: 24px;
        }

        .loading-icon {
            width: 80px;
            height: 80px;
            border: 4px solid #ffffff;
            border-top-color: #000000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 2px;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 32px 24px;
            height: 100%;
            background-color: #ffffff;
        }

        .login-header {
            margin-bottom: 48px;
            text-align: center;
        }

        .login-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #666666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #000000;
            border-radius: 4px;
            background-color: #ffffff;
            color: #000000;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #000000;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
        }

        input::placeholder {
            color: #999999;
        }

        .login-button {
            width: 100%;
            padding: 14px 24px;
            margin-top: 32px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-button:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .login-button:active {
            transform: scale(0.98);
        }

        /* Dashboard Screen */
        .dashboard-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: #ffffff;
        }

        .dashboard-header {
            background-color: #000000;
            color: #ffffff;
            padding: 16px 24px;
            border-bottom: 1px solid #000000;
        }

        .dashboard-header-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .dashboard-header-subtitle {
            font-size: 13px;
            color: #cccccc;
        }

        .dashboard-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .dashboard-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            border-bottom: 2px solid #000000;
            padding-bottom: 8px;
        }

        .card {
            background-color: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-text {
            font-size: 13px;
            color: #666666;
        }

        .dashboard-footer {
            background-color: #f0f0f0;
            border-top: 1px solid #e0e0e0;
            padding: 16px 24px;
            display: flex;
            gap: 12px;
        }

        .footer-button {
            flex: 1;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #000000;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .footer-button:hover {
            background-color: #000000;
            color: #ffffff;
        }

        .footer-button.logout {
            background-color: #000000;
            color: #ffffff;
            flex: 0.5;
        }

        .footer-button.logout:hover {
            background-color: #ffffff;
            color: #000000;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }

            .login-screen {
                padding: 24px 16px;
            }

            .dashboard-content {
                padding: 16px;
            }

            .login-title {
                font-size: 28px;
            }

            .footer-button {
                font-size: 12px;
            }
        }

        /* Hidden state */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Loading Screen -->
        <div id="loadingScreen" class="loading-screen">
            <div class="loading-icon"></div>
            <div class="loading-text">LOADING</div>
        </div>

        <!-- Login Screen -->
        <div id="loginScreen" class="login-screen hidden">
            <div class="login-header">
                <h1 class="login-title">Welcome</h1>
                <p class="login-subtitle">Sign in to your account</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email or Username</label>
                    <input 
                        type="text" 
                        id="email" 
                        placeholder="Enter your email or username"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password"
                        required
                    >
                </div>
                <button type="submit" class="login-button">Sign In</button>
            </form>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashboardScreen" class="dashboard-screen hidden">
            <div class="dashboard-header">
                <h1 class="dashboard-header-title">Dashboard</h1>
                <p class="dashboard-header-subtitle" id="userGreeting">Welcome back</p>
            </div>
            <div class="dashboard-content">
                <div class="dashboard-section">
                    <div class="section-title">Overview</div>
                    <div class="card">
                        <div class="card-title">Profile Status</div>
                        <div class="card-text">Your account is active and verified</div>
                    </div>
                    <div class="card">
                        <div class="card-title">Last Login</div>
                        <div class="card-text" id="lastLogin">Just now</div>
                    </div>
                </div>
                <div class="dashboard-section">
                    <div class="section-title">Quick Stats</div>
                    <div class="card">
                        <div class="card-title">Total Activities</div>
                        <div class="card-text">7 items</div>
                    </div>
                    <div class="card">
                        <div class="card-title">Pending Tasks</div>
                        <div class="card-text">3 tasks</div>
                    </div>
                </div>
            </div>
            <div class="dashboard-footer">
                <button class="footer-button">Settings</button>
                <button class="footer-button">Help</button>
                <button class="footer-button logout" id="logoutBtn">Log Out</button>
            </div>
        </div>
    </div>

    <script>
        // App State
        let currentUser = null;

        // Screen Management
        function showScreen(screenId) {
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        // Initialize App
        function initApp() {
            // Show loading screen for 2.5 seconds
            setTimeout(() => {
                showScreen('loginScreen');
            }, 2500);
        }

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (email && password) {
                // Store user info
                currentUser = email;
                
                // Update greeting
                const userName = email.split('@')[0];
                document.getElementById('userGreeting').textContent = `Welcome back, ${userName}`;
                
                // Update last login
                const now = new Date();
                const timeString = now.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                document.getElementById('lastLogin').textContent = timeString;
                
                // Clear form
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                
                // Show dashboard
                showScreen('dashboardScreen');
            }
        });

        // Handle Logout
        document.getElementById('logoutBtn').addEventListener('click', function() {
            currentUser = null;
            showScreen('loginScreen');
        });

        // Start the app
        initApp();
    </script>
</body>
</html>
